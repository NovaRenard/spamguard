<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Схема SpamGuard</title>
<style>
  :root {
    --bg: #0e1621; --card: #17212b; --card2: #1e2c3a; --line: #2b3b4c; --text: #e8eef5; --muted: #93a3b7;
    --accent: #2aabee; --green: #4cd964; --amber: #ffb020; --red: #ff6b6b; --violet: #a78bfa;
    --glow: rgba(42,171,238,.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f6fb; --card: #ffffff; --card2: #eef3f9; --line: #cfd9e6; --text: #15202b; --muted: #5a6b7f;
      --accent: #1b8fd0; --green: #1f9d3a; --amber: #b87400; --red: #d64545; --violet: #6d4fd6;
      --glow: rgba(27,143,208,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  header { padding: 22px 24px 8px; max-width: 1500px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 36px); letter-spacing: -.01em; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 0; font-size: 14px; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--text); }
  .toggle input { accent-color: var(--accent); width: 18px; height: 18px; }

  .wrap { max-width: 1500px; margin: 0 auto; padding: 8px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 22px; align-items: start; }
  .diagram { position: relative; padding: 8px 46px 30px 8px; }
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 62px 50px; }

  .node { position: relative; text-align: left; background: var(--card); color: var(--text); border: 2px solid var(--line); border-radius: 16px;
    padding: 14px 16px; cursor: pointer; font: inherit; transition: transform .15s, border-color .15s, box-shadow .15s, opacity .15s; min-height: 92px; }
  .node:hover { transform: translateY(-2px); border-color: var(--accent); }
  .node:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .node .ico { font-size: 26px; line-height: 1; }
  .node h3 { margin: 6px 0 2px; font-size: 17px; line-height: 1.25; }
  .node p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
  .badge { position: absolute; top: 10px; right: 10px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1.5px solid; }
  .b-ok { color: var(--green); border-color: var(--green); }
  .b-off { color: var(--amber); border-color: var(--amber); }
  .b-plan { color: var(--violet); border-color: var(--violet); }
  .node.plan { border-style: dashed; }
  .node.core { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow), 0 10px 40px var(--glow); min-height: 150px; background: linear-gradient(160deg, var(--card2), var(--card)); }
  .node.core h3 { font-size: 22px; }
  .node.core .ico { font-size: 40px; }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); transform: translateY(-2px); }
  .node.dim { opacity: .45; }

  .c-me { grid-column: 1 / 7; } .c-tg { grid-column: 1 / 4; } .c-wa { grid-column: 4 / 7; }
  .c-lists { grid-column: 1 / 3; } .c-filter { grid-column: 3 / 5; } .c-links { grid-column: 1 / 3; }
  .c-core { grid-column: 3 / 5; } .c-profile { grid-column: 5 / 7; } .c-docs { grid-column: 1 / 3; }
  .c-decision { grid-column: 3 / 5; } .c-groups { grid-column: 5 / 7; } .c-infra { grid-column: 1 / 7; }
  .r1 { grid-row: 1; } .r2 { grid-row: 2; } .r3 { grid-row: 3; } .r4 { grid-row: 4; } .r5 { grid-row: 5; } .r6 { grid-row: 6; }

  .edge { fill: none; stroke: var(--muted); stroke-width: 2; opacity: .75; }
  .edge.dash { stroke-dasharray: 7 6; }
  .edge.on { stroke: var(--accent); stroke-width: 3.2; opacity: 1; }
  .elabel { font-size: 12px; fill: var(--text); }
  .elabel-bg { fill: var(--bg); stroke: var(--line); }
  .elabel-bg.on { stroke: var(--accent); }

  aside { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 20px 22px 24px; }
  aside h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.2; }
  aside .status { display: inline-block; margin: 6px 0 10px; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1.5px solid; }
  aside h4 { margin: 18px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  aside p, aside li { color: var(--text); }
  aside ul, aside ol { margin: 6px 0; padding-left: 22px; }
  aside li { margin: 4px 0; }
  .kid { background: var(--card2); border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; border-left: 5px solid var(--accent); }
  .kid p { margin: 0 0 10px; } .kid p:last-child { margin: 0; }
  .example { background: var(--card2); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }
  .files code, aside code { background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .jump button { font: inherit; font-size: 13.5px; background: transparent; color: var(--text); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .jump button:hover { border-color: var(--accent); color: var(--accent); }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0; }
  table.t td, table.t th { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  .only-adult { display: none; }
  body.adult .only-adult { display: block; }
  .hint { color: var(--muted); }
  .hint b { color: var(--text); }
  .steps { counter-reset: s; list-style: none; padding-left: 0; }
  .steps li { counter-increment: s; position: relative; padding-left: 34px; margin: 9px 0; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }

  @media (max-width: 980px) {
    .wrap { grid-template-columns: 1fr; padding: 8px 14px 40px; }
    aside { position: static; max-height: none; }
  }
  @media (max-width: 760px) {
    header { padding: 16px 14px 4px; }
    .diagram { padding: 8px 0 20px; }
    svg.edges { display: none; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .grid > .node { grid-column: 1 !important; grid-row: auto !important; }
    .node::after { content: attr(data-step); position: absolute; left: -2px; top: -8px; background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
    .toggle { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Как устроен SpamGuard</h1>
  <p>Схема, по которой сообщение идёт от Telegram или WhatsApp до решения «пропустить, предупредить или заблокировать». Нажми на любой блок, чтобы прочитать, как он работает.</p>
  <div class="legend">
    <span><i class="dot" style="background:var(--green)"></i> работает</span>
    <span><i class="dot" style="background:var(--amber)"></i> по умолчанию только предупреждает</span>
    <span><i class="dot" style="background:var(--violet)"></i> план, ещё не сделано</span>
    <label class="toggle"><input type="checkbox" id="adult"> Подробности для взрослых</label>
  </div>
</header>

<div class="wrap">
  <div class="diagram" id="diagram">
    <svg class="edges" id="edges" aria-hidden="true">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
        <marker id="arrOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
      </defs>
    </svg>
    <div class="grid" id="grid"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script>
/* ---------------------------------------------------------------- содержимое блоков */
const N = {
  me: {
    ico: '🎮', title: 'Вы и Telegram-бот', sub: 'пульт управления всей защитой', status: 'ok', pos: 'c-me r1', step: 1,
    kid: [
      'Представь пульт от телевизора. Бот в Telegram — это пульт от всей защиты. Через него ты подключаешь свои чаты, получаешь предупреждения и нажимаешь кнопки: «Это не спам» или «Выйти из группы».',
      'Бот не пускает чужих. Если незнакомый человек нажмёт «старт», тебе придёт вопрос с двумя кнопками — «Одобрить» и «Отклонить». Пока ты не одобрил, человек ничего не может.'
    ],
    how: [
      'Команды: <code>/start</code> (подключить Telegram по QR), <code>/whatsapp</code>, <code>/status</code>, <code>/stats</code>, <code>/live</code> и <code>/dry</code> (блокировать или только предупреждать), <code>/groupleave</code>, <code>/scan</code>, <code>/testmode</code>, <code>/stop</code>.',
      'Доступ: постоянные ID в <code>.env</code> (<code>ADMIN_IDS</code>, <code>ALLOWED_IDS</code>) и заявки с кнопками. Одобренные записываются в базу. Не больше 5 заявок в час.',
      'Администратор: <code>/users</code> и <code>/revoke &lt;id&gt;</code> (отзыв доступа завершает сессию человека).',
      'Любой текст, присланный боту, он проверяет и показывает вердикт: удобно для проверки без второго аккаунта.'
    ],
    example: 'Незнакомец нажал /start → тебе пришло «🔔 Запрос доступа…» → ты нажал «✅ Одобрить» → ему пришло «Доступ одобрен».',
    files: ['service.py'], jump: ['tg', 'wa', 'decision']
  },
  tg: {
    ico: '✈️', title: 'Telegram', sub: 'первый источник сообщений', status: 'ok', pos: 'c-tg r2', step: 2,
    kid: [
      'Бот входит в твой Telegram так же, как ты входишь на компьютере: показывает QR-код (чёрно-белый квадратик), ты наводишь на него телефон и нажимаешь «разрешить». Теперь бот «слышит», кто тебе пишет.',
      'Он ничего не пишет за тебя и ничего не удаляет, пока ты сам не включишь блокировку. А если захочешь всё отменить — команда <b>/stop</b>, и бот сразу выходит из твоего аккаунта.'
    ],
    how: [
      'Библиотека Telethon: <code>qr_login()</code> с твоим <code>api_id</code>/<code>api_hash</code>, QR обновляется каждые ~30 секунд. Сканировать нужно с другого устройства.',
      'Сессия (пропуск в аккаунт) хранится в <code>state.db</code> в зашифрованном виде (Fernet). Ключ — в <code>.env</code> на сервере. <code>/stop</code> вызывает <code>log_out()</code>: сессия завершается на стороне Telegram.',
      'Если включён пароль 2FA, бот просит его в чате и сразу удаляет сообщение.',
      'События: входящие личные сообщения, добавление в группу/канал, первое сообщение в группе.',
      'Блокировка: жалоба на спам + блок + удаление чата. Не больше 5 в час.'
    ],
    example: 'Новый человек пишет «Привет! Заработай 5000 в день» → бот проверяет → присылает тебе предупреждение.',
    files: ['service.py', 'senderprofile.py'], jump: ['me', 'filter', 'groups']
  },
  wa: {
    ico: '💬', title: 'WhatsApp', sub: 'второй источник, подключается через Telegram', status: 'off', pos: 'c-wa r2', step: 3,
    kid: [
      'WhatsApp сам не умеет дружить с нашим ботом. Поэтому есть «переводчик» — программа <b>Evolution</b>. Вот как всё подключается:',
      '<ol class="steps"><li>Ты пишешь боту в Telegram: <b>/whatsapp</b>.</li><li>Бот просит переводчика сделать для тебя отдельную «комнату» и присылает QR-код прямо в Telegram.</li><li>Ты открываешь WhatsApp: Настройки → Связанные устройства → Привязка устройства, и наводишь на QR.</li><li>Переводчик слышит твои сообщения из WhatsApp и шепчет их боту. Бот проверяет.</li><li>Если что-то подозрительное — предупреждение приходит тебе в <b>Telegram</b>.</li></ol>',
      'Если QR не отсканировали за 5 минут, «комната» сама убирается, чтобы мусор не копился.'
    ],
    how: [
      'Evolution API v2.3.7 (на основе Baileys) в Docker, рядом свой Postgres и Redis. Наружу порты не открыты.',
      'Экземпляр на каждого человека: <code>sg_&lt;telegram id&gt;</code>. Evolution шлёт вебхуки боту по внутренней сети на адрес с секретом: <code>qrcode.updated</code>, <code>connection.update</code>, <code>messages.upsert</code>, <code>group-participants.update</code>.',
      '<b>Уборщик</b> раз в минуту сверяет Evolution с нашей базой: удаляет неподключённые старше 5 минут (<code>WA_PAIR_TTL_SEC</code>), «сирот» без записи у нас и подключённые, которые давно без связи (больше часа). Чужие экземпляры не трогает.',

      'Новый чат = вы туда не писали и в истории чата нет сообщений до подключения. Если Evolution не ответил, бот молчит (лучше пропуск, чем ложная тревога).'
    ],
    example: '/whatsapp → QR в Telegram → скан → «✅ WhatsApp подключён. Анализ запущен» → всё остальное как у Telegram.',
    files: ['whatsapp.py', 'docker-compose.yml', 'evolution.env.example'], jump: ['me', 'infra', 'filter']
  },
  filter: {
    ico: '🤝', title: 'Знакомый или чужой?', sub: 'первый вопрос к каждому сообщению', status: 'ok', pos: 'c-filter r3', step: 4,
    kid: [

      'А вот незнакомца, который пишет первым, бот изучает внимательно. Но если твой друг вдруг пришлёт опасную ссылку (его мог взломать мошенник), бот всё равно скажет тебе: «Возможно, его взломали».'
    ],
    how: [
      'Telegram: чужой = не контакт, не бот, не верифицированный, и вы ему никогда не писали. Результат запоминается (список доверенных).',

    ],
    example: 'Ты написал(а) Ане вчера → её сегодняшние сообщения не проверяются. Незнакомец пишет в первый раз → проверка.',
    files: ['service.py', 'whatsapp.py'], jump: ['core', 'links']
  },
  lists: {
    ico: '📚', title: 'Списки: обновление раз в сутки', sub: 'откуда ссылки знают, что плохо', status: 'ok', pos: 'c-lists r3', step: 5,
    kid: [
      'Представь школьный список «плохих сайтов», который учителя обновляют каждый день. Бот делает так же: раз в сутки сам скачивает свежие списки и кладёт в папку. Потом сверяется с ними мгновенно.',

/* ---------------------------------------------------------------- стрелки (SVG поверх сетки) */
function anchor(el, side, off, box) {
  const r = el.getBoundingClientRect();
  const x = r.left - box.left, y = r.top - box.top;
  if (side === 't') return [x + r.width * off, y, 0, -1];
  if (side === 'b') return [x + r.width * off, y + r.height, 0, 1];
  if (side === 'l') return [x, y + r.height * off, -1, 0];
  return [x + r.width, y + r.height * off, 1, 0];
}

function draw(active) {
  svg.querySelectorAll('.edge, .elabel, .elabel-bg').forEach(e => e.remove());
  if (window.matchMedia('(max-width: 760px)').matches) return;
  const box = document.getElementById('diagram').getBoundingClientRect();
  const frag = [];
  E.forEach(([a, as, ao, b, bs, bo, label, dash]) => {
    const A = document.getElementById('n-' + a), B = document.getElementById('n-' + b);
    let d, loopMid = null;
    const on = active && (a === active || b === active);
    if (as === 'loop') {
      const rb = A.getBoundingClientRect(), rt = B.getBoundingClientRect();
      const x1 = rb.left - box.left + rb.width / 2, y1 = rb.bottom - box.top;
      const xr = box.width - 18, y2 = rt.top - box.top + rt.height / 2, x2 = rt.right - box.left;
      const yb = y1 + 26;
      d = `M${x1},${y1} V${yb} H${xr} V${y2} H${x2 + 3}`;
      loopMid = { x: (x1 + xr) / 2, y: yb };  // подпись на нижнем горизонтальном отрезке, чтобы не обрезалась справа
    } else {
      const [x1, y1, dx1, dy1] = anchor(A, as, ao, box), [x2, y2, dx2, dy2] = anchor(B, bs, bo, box);
      const k = Math.max(34, Math.hypot(x2 - x1, y2 - y1) * 0.38);
      d = `M${x1},${y1} C${x1 + dx1 * k},${y1 + dy1 * k} ${x2 + dx2 * k},${y2 + dy2 * k} ${x2 - dx2 * 3},${y2 - dy2 * 3}`;
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('class', 'edge' + (dash ? ' dash' : '') + (on ? ' on' : ''));
    p.setAttribute('marker-end', on ? 'url(#arrOn)' : 'url(#arr)');
    svg.appendChild(p);
    const len = p.getTotalLength();
    const pt = as === 'loop' ? loopMid : p.getPointAtLength(len * 0.5);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('class', 'elabel'); t.setAttribute('x', pt.x); t.setAttribute('y', pt.y + 4); t.setAttribute('text-anchor', 'middle'); t.textContent = label;
    svg.appendChild(t);
    const bb = t.getBBox(), bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('class', 'elabel-bg' + (on ? ' on' : '')); bg.setAttribute('rx', 8);
    bg.setAttribute('x', bb.x - 6); bg.setAttribute('y', bb.y - 2); bg.setAttribute('width', bb.width + 12); bg.setAttribute('height', bb.height + 4);
    svg.insertBefore(bg, t);
  });
}
