name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the model
        run: python make_dataset.py && python train.py

      - name: Run tests
        run: |
          set -e
          for test in tests_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Build production image
        run: docker build -t spamguard-test .
